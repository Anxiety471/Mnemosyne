name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # cargo-audit is not on the runner image; this fetches a prebuilt binary.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Known-vulnerable dependencies
        run: cargo audit
      - name: Tool count claimed in the docs
        run: python3 ops/check_docs_tools.py

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: ui
      - run: npm run typecheck
        working-directory: ui
      - run: npm run lint
        working-directory: ui
      - run: npm test
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - name: Known-vulnerable dependencies (production only)
        run: npm audit --omit=dev --audit-level=high
        working-directory: ui

  ops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/stable/shellcheck-stable.linux.x86_64.tar.xz \
            | tar -xJ --strip-components=1 -C "$HOME/.local/bin" shellcheck-stable/shellcheck
          shellcheck ops/backup.sh ops/restore.sh install.sh
      - name: hadolint
        run: |
          curl -fsSL https://github.com/hadolint/hadolint/releases/download/v2.13.1/hadolint-Linux-x86_64 \
            -o "$HOME/.local/bin/hadolint"
          chmod +x "$HOME/.local/bin/hadolint"
          hadolint --ignore DL3008 Dockerfile
      # uvx is not on the runner image.
      - uses: astral-sh/setup-uv@v7
      - name: Python integrations (ruff, unit tests)
        run: |
          uvx ruff check integrations/
          python3 -m unittest discover -s integrations/hermes/drawer-mirror/tests -v
      - name: Maintenance scripts and Compose
        run: |
          bash -n ops/backup.sh ops/restore.sh install.sh
          sh -n install.sh
          python3 ops/test_backup_restore.py
          python3 ops/check_docs_tools.py
          cp .env.example .env
          mkdir -p backups
          DRAWER_PUBLISH=127.0.0.1:8787 docker compose config -q

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Compose reads .env for env_file, and docs/deploy.md has backups/ created before the
      # first run. The example's token is the one the steps below authenticate with.
      - name: Create .env and backups/
        run: |
          cp .env.example .env
          mkdir -p backups
      - name: Build and start Ubuntu container
        run: docker compose up -d --build
      - name: Wait for the container healthcheck
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q drawer)" 2>/dev/null | grep -q healthy; then break; fi
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q drawer)")" = healthy
          docker compose exec -T drawer bash -c 'exec 3<>/dev/tcp/127.0.0.1/8787 && echo health probe ok'
      - name: Verify health and auth boundary
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/auth/me > /tmp/drawer-status.json; then break; fi
            sleep 2
          done
          grep -q '"mode":"password"' /tmp/drawer-status.json
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/drawer/v1/tree?path=/)" = 401
      - name: Verify backup and restore roundtrip
        run: |
          set -euo pipefail
          token='replace-with-a-different-long-random-token'
          base='http://127.0.0.1:8787/drawer/v1'
          curl -fsS -X PUT -H "Authorization: Bearer $token" --data-binary 'before backup' "$base/files?path=/restore-check.txt"
          bash ops/backup.sh
          archive="$(find backups -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "$archive"
          test -f "$archive.sha256"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health; then break; fi
            sleep 2
          done
          curl -fsS -X PUT -H "Authorization: Bearer $token" --data-binary 'after backup' "$base/files?path=/restore-check.txt"
          printf 'RESTORE\n' | bash ops/restore.sh "$archive"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health; then break; fi
            sleep 2
          done
          test "$(curl -fsS -H "Authorization: Bearer $token" "$base/files?path=/restore-check.txt")" = 'before backup'
          docker compose exec -T drawer drawer doctor
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color || true
      - name: Tear down
        if: always()
        run: docker compose down
