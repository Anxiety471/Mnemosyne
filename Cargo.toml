[package]
name = "drawer"
version = "0.1.3"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
async_zip = { version = "0.0.18", features = ["tokio", "deflate"] }
axum = "0.8.9"
base64 = "0.22"
cap-std = "3.4.5"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
fs2 = "0.4.3"
futures-lite = "2.6.1"
hex = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-streamable-http-server", "transport-io"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
similar = "2.7.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors", "fs"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
anyhow = "1.0.104"
http-body-util = "0.1.5"
rmcp = { version = "3.5.1", features = ["client", "transport-streamable-http-client-reqwest"] }
tempfile = "3.27.0"
tower = "0.5.3"
